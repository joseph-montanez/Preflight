# Terminal editor launched by the [E] editor keys in the browsers
# (list entry, search popup, remote edit). Plain command line, no shell:
# quotes are honored, ~ is expanded. GUI editors that detach need a wait
# flag (e.g. "code --wait"). Leave empty to disable the editor keys.
editor: "hx"

accounts:
  - id: "prod-web"
    name: "Production Web 01"
    protocol: "sftp"
    host: "ssh.example.com"
    port: 22
    auth:
      type: "key"
      username: "deploy"
      key_path: "~/.ssh/id_ed25519"
      passphrase_prompt: true

  - id: "legacy-ftps"
    name: "Legacy FTPS"
    protocol: "ftps"
    host: "ftp.example.com"
    port: 21
    tls_mode: "explicit"
    auth:
      type: "password"
      username: "deploy"
      password_env: "PREFLIGHT_FTP_PASSWORD"

projects:
  - id: "api-backend"
    name: "Backend API"
    account_id: "prod-web"
    local_root: "/Users/dev/code/api-backend"
    path_mappings:
      - local_path: "public"
        remote_path: "/var/www/api-backend"
      - local_path: "deploy/config"
        remote_path: "/etc/api-backend"
    default_diff_mode: "text"
    text_diff_options:
      ignore_whitespace: true
      ignore_blank_lines: true
      strip_comments: true
    exclusions:
      - ".git/"
      - ".env*"
      - "node_modules/"
      - "vendor/"
      - "storage/logs/*.log"

# Named multi-step remote tasks (run configurations). Pick Run in the
# launcher or run `preflight -run <id>`. Steps run in order: a run step
# executes a command over an SFTP account (FTP has no shell), while an
# upload step streams one local file to an absolute remote path (SFTP or
# FTP/FTPS). Workdir is entered with cd before run, and a failing step
# stops the run unless on_error is "continue".
tasks:
  - id: "deploy-apiv2"
    name: "Build apiv2 and restart"
    on_error: "stop"
    steps:
      - account_id: "prod-web"
        workdir: "apiv2"
        run: "make build"
      - account_id: "prod-web"
        run: "supervisorctl restart apiv2"
  - id: "deploy-binary"
    name: "Stop, upload, restart"
    on_error: "stop"
    steps:
      - account_id: "prod-web"
        run: "systemctl --user stop apiv2"
      - account_id: "prod-web"
        upload: "dist/apiv2.bin"
        remote: "/opt/apiv2/apiv2.bin"
      - account_id: "prod-web"
        run: "systemctl --user start apiv2"
